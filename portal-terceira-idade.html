<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Protótipo do Portal da Terceira Idade: conecta pessoas aposentadas a ONGs locais para doar tempo e conhecimento.">
<title>Portal da Terceira Idade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: portal institucional — barra de acessibilidade, cabeçalho branco com menu sublinhado, faixa de destaque escura na home, conteúdo em até 1200px, rodapé em colunas; notas de IHC numa gaveta lateral */
:root{
  --bg:#F4F6F5; --band:#EBF0EE; --surface:#FFFFFF; --ink:#0F1E19; --muted:#4A5853; --line:#D5DED9; --line-strong:#9AAAA3;
  --accent:#0A5C4A; --accent-hover:#08483A; --accent-ink:#FFFFFF; --accent-soft:#E4F1EC;
  --deep:#0B2B23; --deep-2:#103A2F; --deep-ink:#F1F6F4; --deep-muted:#B3C9C1;
  --sun:#F2B30C; --sun-ink:#231900; --warn-bg:#FFF2D6; --warn-ink:#6E3D00; --danger:#B3261E;
  --shadow:0 1px 2px rgba(15,30,25,.06), 0 6px 18px -6px rgba(15,30,25,.12);
  --shadow-lg:0 2px 4px rgba(15,30,25,.06), 0 18px 40px -16px rgba(15,30,25,.28);
  --r:10px; --r-lg:14px;
  --f-display:"Public Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1613; --band:#131D19; --surface:#17221E; --ink:#ECF2EE; --muted:#AEBDB5; --line:#2C3B35; --line-strong:#5B6E66;
  --accent:#5FCCAB; --accent-hover:#7ADBBD; --accent-ink:#05251C; --accent-soft:#183329;
  --deep:#08130F; --deep-2:#0E1E18; --deep-ink:#E6EFEA; --deep-muted:#9DB3AA;
  --sun:#FFC83D; --sun-ink:#231900; --warn-bg:#3A2A0C; --warn-ink:#FFD891; --danger:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 18px 40px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1613; --band:#131D19; --surface:#17221E; --ink:#ECF2EE; --muted:#AEBDB5; --line:#2C3B35; --line-strong:#5B6E66;
  --accent:#5FCCAB; --accent-hover:#7ADBBD; --accent-ink:#05251C; --accent-soft:#183329;
  --deep:#08130F; --deep-2:#0E1E18; --deep-ink:#E6EFEA; --deep-muted:#9DB3AA;
  --sun:#FFC83D; --sun-ink:#231900; --warn-bg:#3A2A0C; --warn-ink:#FFD891; --danger:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 18px 40px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
.site[data-contrast="high"]{
  --bg:#000; --band:#000; --surface:#000; --ink:#FFF; --muted:#F2F2F2; --line:#FFF; --line-strong:#FFF;
  --accent:#FFD400; --accent-hover:#FFE14D; --accent-ink:#000; --accent-soft:#1A1A1A;
  --deep:#000; --deep-2:#000; --deep-ink:#FFF; --deep-muted:#F2F2F2;
  --warn-bg:#000; --warn-ink:#FFD400; --danger:#FF9C94; --shadow:none; --shadow-lg:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); line-height:1.55}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--deep)}
button{font:inherit; color:inherit}
:focus-visible{outline:4px solid var(--sun); outline-offset:3px}
svg.i{width:1.2em; height:1.2em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.site{--fs:20px; font-size:var(--fs); min-height:100vh; background:var(--bg); color:var(--ink); display:flex; flex-direction:column}
.wrap{max-width:1200px; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); width:100%}
.skip{position:absolute; left:-9999px}
.skip:focus{left:16px; top:16px; z-index:50; background:var(--sun); color:var(--sun-ink); padding:12px 16px; border-radius:var(--r); font-weight:700}

/* barra de acessibilidade */
.a11y{background:var(--deep); color:var(--deep-ink); font-size:.68em; border-bottom:1px solid rgba(255,255,255,.08)}
.a11y .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; padding-block:6px}
.a11y .grp{display:flex; align-items:center; gap:6px}
.a11y .lb{font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--deep-muted)}
.a11y button{min-height:44px; min-width:44px; padding:0 12px; border-radius:8px; border:1.5px solid rgba(255,255,255,.35); background:transparent; color:inherit; font-weight:700; cursor:pointer}
.a11y button:hover{border-color:var(--deep-ink)}
.a11y button[aria-pressed="true"]{background:var(--sun); color:var(--sun-ink); border-color:var(--sun)}
.site[data-contrast="high"] .a11y button{border-color:#fff}

/* cabeçalho */
.head{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); box-shadow:0 1px 0 var(--line), 0 8px 24px -18px rgba(0,0,0,.35)}
.head .bar1{display:flex; align-items:center; gap:20px; padding-block:14px}
.logo{display:flex; align-items:center; gap:14px; border:0; background:transparent; cursor:pointer; padding:4px; text-align:left; flex:1; min-width:0}
.logo svg.mark{width:52px; height:52px; flex:none}
.logo .wm{display:flex; flex-direction:column; gap:3px; padding-left:14px; border-left:1.5px solid var(--line); min-width:0}
.logo b{font-family:var(--f-display); font-weight:800; font-size:1.12em; line-height:1.1; letter-spacing:-.01em}
.logo small{font-size:.62em; color:var(--muted); font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.me{display:inline-flex; align-items:center; gap:10px; min-height:56px; padding:0 16px 0 6px; border-radius:30px; border:1.5px solid var(--line-strong); background:var(--surface); font-size:.78em; cursor:pointer}
.me:hover{border-color:var(--accent)}
.me .av{width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-display); font-weight:800}
.me .nm{display:flex; flex-direction:column; text-align:left; line-height:1.2}
.me .nm small{font-size:.85em; color:var(--muted)}
.me[aria-current="page"]{border-color:var(--accent); background:var(--accent-soft)}
.nav{border-top:1px solid var(--line)}
.nav .wrap{display:grid; grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{position:relative; display:flex; align-items:center; justify-content:center; gap:10px; min-height:62px; padding:8px 10px; border:0; border-bottom:3px solid transparent; border-radius:0; background:transparent; font-family:var(--f-display); font-weight:700; font-size:.74em; line-height:1.2; text-align:center; cursor:pointer; color:var(--muted)}
.nav button svg.i{width:1.4em; height:1.4em}
.nav button:hover{color:var(--ink); background:var(--band)}
.nav button[aria-current="page"]{color:var(--accent); border-bottom-color:var(--accent)}
.site[data-contrast="high"] .nav button[aria-current="page"]{color:var(--accent)}
.badge{min-width:24px; height:24px; padding:0 7px; border-radius:12px; background:var(--danger); color:#fff; font-size:.8em; display:grid; place-items:center; font-family:var(--f-body)}
.site[data-contrast="high"] .badge{color:#000}

main{flex:1; padding-block:0 72px}
main > .wrap{padding-top:32px}
.crumbs{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:26px; font-size:.8em}
.crumbs ol{display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:0; padding:0; color:var(--muted)}
.crumbs li+li::before{content:"/"; margin-right:6px; color:var(--line-strong)}
.crumbs [aria-current]{color:var(--ink); font-weight:700}
.backbtn{display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:0 16px; border-radius:var(--r); border:1.5px solid var(--line-strong); background:var(--surface); font-weight:700; cursor:pointer}
.backbtn:hover{border-color:var(--accent)}

/* tipografia */
.h1{font-family:var(--f-display); font-weight:800; font-size:1.9em; line-height:1.12; letter-spacing:-.02em; margin:0; text-wrap:balance}
.h2{font-family:var(--f-display); font-weight:700; font-size:1.25em; line-height:1.25; letter-spacing:-.01em; margin:0; text-wrap:balance}
.h3{font-family:var(--f-display); font-weight:700; font-size:1.02em; margin:0}
p{margin:0}
.muted{color:var(--muted)}
.lead{font-size:1.08em; max-width:36em}
.stack{display:flex; flex-direction:column; gap:12px; min-width:0}
.stack-lg{display:flex; flex-direction:column; gap:22px; min-width:0}
.section{display:flex; flex-direction:column; gap:20px; margin-top:52px}
.sec-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; padding-bottom:14px; border-bottom:1px solid var(--line)}
.tag{display:inline-flex; align-self:flex-start; align-items:center; gap:6px; font-size:.68em; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.sec-t{font-size:.7em; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--muted)}
.pin{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--sun); color:var(--sun-ink); font:700 14px/1 var(--f-body); vertical-align:middle; margin-left:6px; box-shadow:0 0 0 3px var(--surface); flex:none; letter-spacing:0; text-transform:none}

/* faixa de destaque da home */
.band-hero{background:var(--deep); color:var(--deep-ink); background-image:radial-gradient(120% 140% at 100% 0%, var(--deep-2) 0%, var(--deep) 60%)}
.band-hero .wrap{padding-block:48px 52px}
.hero{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:40px; align-items:center}
.welcome{display:flex; flex-direction:column; gap:16px}
.welcome .sec-t{color:var(--deep-muted)}
.welcome .h1{font-size:2.4em; color:var(--deep-ink)}
.welcome .lead{color:var(--deep-muted)}
.welcome .lead b{color:var(--deep-ink)}
.band-hero .next{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-lg); border:0}
.site[data-contrast="high"] .band-hero .next{border:2px solid var(--line)}

/* grades */
.split{display:grid; grid-template-columns:320px minmax(0,1fr); gap:32px; align-items:start}
.detail{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:40px; align-items:start}
.two{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:32px; align-items:start}
.narrow{max-width:760px; margin-inline:auto; display:flex; flex-direction:column; gap:22px}
.sticky{position:sticky; top:170px}
.grid-actions{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:20px}

/* botões */
.btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:max(60px,3em); padding:10px 24px; border-radius:var(--r); border:2px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-family:var(--f-display); font-weight:700; font-size:.92em; cursor:pointer; text-align:center}
.btn:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
.btn.auto{width:auto; align-self:flex-start}
.btn.sec{background:var(--surface); color:var(--ink); border-color:var(--line-strong)}
.btn.sec:hover{border-color:var(--accent); color:var(--accent)}
.btn.quiet{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.quiet:hover{border-color:var(--line-strong)}
.btn.danger{background:transparent; color:var(--danger); border-color:var(--danger)}
.btn.sun{background:var(--sun); color:var(--sun-ink); border-color:var(--sun)}
.btn.sun:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent; color:var(--deep-ink); border-color:rgba(255,255,255,.45)}
.btn.ghost:hover{border-color:var(--deep-ink)}
.site[data-contrast="high"] .btn.ghost{border-color:#fff}
.btn:active{transform:translateY(1px)}
.btn-row{display:flex; flex-wrap:wrap; gap:12px}
.btn-row .btn{width:auto; flex:1 1 220px}
.btn-row.left .btn{flex:0 1 auto}
.lnk{display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:0 4px; border:0; background:transparent; color:var(--accent); font-family:var(--f-display); font-weight:700; font-size:.85em; cursor:pointer; text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:2px}

.action{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px; width:100%; min-height:100px; padding:18px; text-align:left; border-radius:var(--r-lg); border:1.5px solid var(--line); background:var(--surface); box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s, transform .15s}
.action:hover{border-color:var(--accent); transform:translateY(-2px)}
.action .ic{width:52px; height:52px; border-radius:var(--r); display:grid; place-items:center; background:var(--accent-soft); color:var(--accent)}
.site[data-contrast="high"] .action .ic{border:2px solid var(--line)}
.action .ic svg.i{width:1.4em; height:1.4em}
.action b{display:block; font-family:var(--f-display); font-size:.95em}
.action .s{display:block; font-size:.78em; color:var(--muted)}
.action > svg.i{color:var(--muted)}
.count{min-width:32px; height:32px; padding:0 10px; border-radius:16px; background:var(--danger); color:#fff; font-weight:700; display:grid; place-items:center; font-size:.8em}

.next{padding:24px; border-radius:var(--r-lg); background:var(--accent-soft); display:flex; flex-direction:column; gap:12px; border:1.5px solid transparent}
.site[data-contrast="high"] .next{border-color:var(--line)}
.next .when{font-family:var(--f-display); font-weight:800; font-size:1.15em; letter-spacing:-.01em}
.facts{display:flex; flex-direction:column; gap:12px; margin:0; padding:0; list-style:none}
.facts li{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start}
.facts svg.i{margin-top:.15em; color:var(--accent)}
.impact{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); border:1.5px solid var(--line); border-radius:var(--r-lg); background:var(--surface); box-shadow:var(--shadow); overflow:hidden}
.impact div{padding:20px 22px; border-left:1.5px solid var(--line); margin-left:-1.5px}
.impact b{display:block; font-family:var(--f-display); font-weight:800; font-size:1.8em; line-height:1.1; letter-spacing:-.02em; color:var(--accent); font-variant-numeric:tabular-nums}
.impact span{font-size:.78em; color:var(--muted)}

/* chips e interruptores */
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{display:inline-flex; align-items:center; gap:8px; min-height:max(54px,2.7em); padding:0 18px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--surface); font-weight:700; font-size:.86em; cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.seg .chip{justify-content:center; padding:0 8px; border-radius:var(--r)}
.switch{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; width:100%; min-height:84px; padding:14px 18px; border:1.5px solid var(--line-strong); border-radius:var(--r-lg); background:var(--surface); text-align:left; cursor:pointer}
.switch:hover{border-color:var(--accent)}
.switch b{display:block}
.switch .s{display:block; font-size:.8em; color:var(--muted)}
.switch .st{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.68em; font-weight:700}
.track{width:62px; height:34px; border-radius:17px; background:var(--line-strong); position:relative; transition:background .2s}
.track::after{content:""; position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:50%; background:var(--surface); transition:left .2s}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{left:32px; background:var(--accent-ink)}

.filters{display:flex; flex-direction:column; gap:22px; padding:22px; border-radius:var(--r-lg); background:var(--surface); border:1.5px solid var(--line); box-shadow:var(--shadow)}
.filters .ft{font-family:var(--f-display); font-weight:800; font-size:1em; padding-bottom:12px; border-bottom:1px solid var(--line)}

/* cartões de atividade */
.opp{display:flex; flex-direction:column; gap:10px; width:100%; height:100%; padding:22px; border-radius:var(--r-lg); border:1.5px solid var(--line); background:var(--surface); box-shadow:var(--shadow); text-align:left; cursor:pointer; transition:border-color .15s, transform .15s}
.opp:hover{border-color:var(--accent); transform:translateY(-2px)}
.opp .t{font-family:var(--f-display); font-weight:700; font-size:1.05em; line-height:1.25; letter-spacing:-.01em}
.opp .o{color:var(--muted); font-size:.85em}
.opp .row{display:flex; flex-direction:column; gap:4px; font-size:.84em}
.opp .row span{display:inline-flex; align-items:center; gap:6px}
.opp .more{margin-top:auto; padding-top:12px; border-top:1px solid var(--line)}
.match{display:flex; align-items:center; gap:8px; font-size:.82em; font-weight:700; color:var(--accent)}
.seals{display:flex; flex-wrap:wrap; gap:6px}
.seal{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:6px; font-size:.72em; font-weight:700; background:var(--accent-soft); color:var(--ink)}
.seal.warn{background:var(--warn-bg); color:var(--warn-ink)}
.site[data-contrast="high"] .seal{border:1.5px solid var(--line)}
.more{display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:var(--f-display); font-weight:700; font-size:.84em; color:var(--accent)}

.box{padding:18px 20px; border-radius:var(--r-lg); border:1.5px solid var(--line); display:flex; flex-direction:column; gap:8px; background:var(--surface)}
.box.warn{background:var(--warn-bg); color:var(--warn-ink); border-color:transparent}
.site[data-contrast="high"] .box.warn{border-color:var(--warn-ink)}
.box.soft{background:var(--accent-soft); border-color:transparent}
.box .h{display:flex; align-items:center; gap:8px; font-weight:700}
.card{padding:24px; border-radius:var(--r-lg); border:1.5px solid var(--line); background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px}

.video{position:relative; aspect-ratio:16/9; max-width:100%; border-radius:var(--r-lg); overflow:hidden; background:linear-gradient(135deg,#2E5B4E,#0F2A23)}
.video .scene{position:absolute; inset:0; display:grid; place-items:center}
.video .play{width:84px; height:84px; border-radius:50%; background:rgba(255,255,255,.94); display:grid; place-items:center}
.video .play svg.i{width:36px; height:36px; fill:#0B3D32; stroke:none}
.video .cc{position:absolute; top:12px; left:12px; padding:4px 10px; border-radius:6px; background:#FFD400; color:#000; font-weight:700; font-size:.64em}
.video .cap{position:absolute; left:14px; right:14px; bottom:14px; padding:10px 14px; border-radius:8px; background:rgba(0,0,0,.84); color:#fff; font-size:.88em; line-height:1.35; text-align:center}
details.tr{border:1.5px solid var(--line); border-radius:var(--r-lg); background:var(--surface)}
details.tr summary{min-height:64px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:700; cursor:pointer; list-style:none}
details.tr summary::-webkit-details-marker{display:none}
details.tr[open] summary .chev{transform:rotate(90deg)}
details.tr .body{padding:0 20px 20px; display:flex; flex-direction:column; gap:8px; font-size:.9em}

.steps{display:flex; flex-direction:column; gap:10px}
.steps .bar{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.steps .bar span{height:8px; border-radius:4px; background:var(--line)}
.steps .bar span.on{background:var(--accent)}
.steps .lbl{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; font-size:.76em; font-weight:700; color:var(--muted)}
.steps .lbl span.on{color:var(--ink)}
.radio{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center; width:100%; min-height:84px; padding:14px 18px; text-align:left; border-radius:var(--r-lg); border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer}
.radio:hover{border-color:var(--accent)}
.radio .dot{width:28px; height:28px; border-radius:50%; border:2.5px solid var(--muted); display:grid; place-items:center}
.radio[aria-checked="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent); background:var(--accent-soft)}
.radio[aria-checked="true"] .dot{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}
.radio[aria-checked="true"] .dot svg.i{width:16px; height:16px; stroke-width:3.2}
.radio b{display:block}

  <button class="fab" data-act="drawer" aria-expanded="${S.drawer}">${ic('info')}<span class="lbl">Notas de IHC</span> (${notes.length})</button>
  ${S.drawer ? `<aside class="drawer" role="dialog" aria-label="Notas de IHC">
    <div class="top"><div><span class="eyebrow">Seminário de IHC</span><h2>Decisões de design</h2></div><button class="close" data-act="drawer" aria-label="Fechar notas">${ic('x')}</button></div>
    <div class="persona"><div class="av" aria-hidden="true">SG</div><div><b>Persona: Seu Geraldo, 73 anos</b><ul><li>Professor aposentado</li><li>Tremor essencial leve nas mãos</li><li>Perda auditiva progressiva</li></ul></div></div>
    <div class="d-sec"><h3>Ir para a página</h3><div class="d-tools">${JUMPS.map(([k,l]) => `<button data-jump="${k}" aria-pressed="${S.screen === k}">${l}</button>`).join('')}</div></div>
    <div class="d-sec"><h3>Demonstração</h3><div class="d-tools">
      <button data-act="pins" aria-pressed="${S.pins}">Marcadores numerados</button>
      <button data-act="simulate">${ic('bell')} Simular nova mensagem</button></div></div>
    <div class="d-sec"><h3>Nesta página: ${TITLES[S.screen]}</h3>
      <ol class="notes">${notes.map((n,i) => `<li><span class="num">${i+1}</span><span><b>${n.t}</b>${n.d}<br><span class="ref">${n.r}</span></span></li>`).join('')}</ol></div>
  </aside>` : ''}`;

  if (changed && lastScreen !== null){
    window.scrollTo(0,0);
    const h = root.querySelector('[data-focus]'); if (h) h.focus({preventScroll:true});
  } else if (fKey){
    const sel = `[data-act="${fKey[0]}"]` + (fKey[1] ? `[data-arg="${CSS.escape(fKey[1])}"]` : '');
    const el = root.querySelector(sel); if (el) el.focus({preventScroll:true});
  }
  const th = root.querySelector('.thread'); if (th) th.scrollTop = th.scrollHeight;
  lastScreen = S.screen;
}

function toast(msg){
  let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}
function flash(){ const f = root.querySelector('.flashframe'); if (!f) return; f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }

/* ---------- Navegação e ações ---------- */
function go(screen){
  if (screen === S.screen){ render(); return; }
  S.hist.push(S.screen); S.screen = screen; S.confirm = null;
  if (screen === 'mensagens'){ S.unread = 0; S.alert = null; }
  render();
}
function back(){
  if (S.screen === 'inscricao' && S.signup.step > 1){ S.signup.step--; S.signup.err = false; lastScreen = null; render(); return; }
  S.confirm = null; S.screen = S.hist.pop() || 'home'; render();
}
function receive(text, conv){
  conv = conv || 'ana';
  S.convs[conv].msgs.push({me:false, d:'Hoje', h:nowH(), t:text});
  if (!(S.screen === 'mensagens' && S.conv === conv)){ S.unread++; if (S.visual) S.alert = text; }
  render(); if (S.visual) flash();
}
function sendMsg(text){
  if (!text.trim()){ toast('Escreva ou dite uma mensagem antes de enviar'); return; }
  const c = S.conv;
  S.convs[c].msgs.push({me:true, d:'Hoje', h:nowH(), t:text.trim()}); S.draft = ''; render();
  setTimeout(() => receive('Combinado, Seu Geraldo! Obrigada por avisar.', c), 2200);
}

let lastTap = 0;
root.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-jump]'); if (!el) return;
  if (el.dataset.jump){ jump(el.dataset.jump); return; }
  const a = el.dataset.act, g = el.dataset.arg;
  const now = Date.now();
  if (S.ignoreRepeat && a !== 'drawer' && a !== 'pins' && now - lastTap < 650){ ev.preventDefault(); toast('Toque repetido ignorado'); return; }
  lastTap = now;
  switch(a){
    case 'go': go(g); break;
    case 'back': back(); break;
    case 'open': S.opp = g; if (S.screen === 'detalhe') render(); else go('detalhe'); break;
    case 'area': S.area = g; render(); break;
    case 'modo': S.modo = g; render(); break;
    case 'adequadas': S.adequadas = !S.adequadas; render(); break;
    case 'startSignup': S.signup = {step:1, day:null, contact:S.contact, err:false}; go('inscricao'); break;
    case 'pickDay': S.signup.day = g; S.signup.err = false; render(); break;
    case 'pickContact': S.signup.contact = g; render(); break;
    case 'stepNext':
      if (S.signup.step === 1 && !S.signup.day){ S.signup.err = true; render(); break; }
      S.signup.step++; lastScreen = null; render(); break;
    case 'stepTo': S.signup.step = +g; lastScreen = null; render(); break;
    case 'confirmSignup': {
      const o = opp(S.opp); const d = o.dias.find(x => x.id === S.signup.day);
      const e = {opp:o.id, dia:d.dia, hora:d.hora, contato:contactName(S.signup.contact)};
      S.enrolled = S.enrolled.filter(x => x.opp !== o.id).concat(e); S.lastEnrolled = e; S.undone = false;
      S.hist = ['home']; S.screen = 'sucesso'; render();
      if (o.id === 'leitura') setTimeout(() => receive('Que alegria, Seu Geraldo! A sala é a número 2, no térreo. Até ' + d.dia.split(',')[0].toLowerCase() + '!'), 5000);
      break; }
    case 'askUndo': S.confirm = 'undo'; render(); break;
    case 'undoYes': S.enrolled = S.enrolled.filter(x => x.opp !== S.opp); S.undone = true; S.confirm = null; lastScreen = null; render(); break;
    case 'confirmNo': S.confirm = null; render(); break;
    case 'askCancel': S.confirm = 'cancel:' + g; render(); break;
    case 'cancelYes': S.enrolled = S.enrolled.filter(x => x.opp !== g); S.confirm = null; render(); toast('Participação cancelada. A ONG foi avisada.'); break;
    case 'conv': S.conv = g; S.draft = ''; render(); break;
    case 'quick': sendMsg(g); break;
    case 'send': sendMsg(S.draft); break;
    case 'dictate':
      if (S.dictating) break;
      S.dictating = true; render();
      setTimeout(() => { S.dictating = false; S.draft = 'Bom dia. Posso levar alguns livros meus para as crianças?'; render(); }, 1800);
      break;
    case 'readAlert': S.conv = 'ana'; go('mensagens'); break;
    case 'closeAlert': S.alert = null; render(); break;
    case 'size': S.size = Math.max(0, Math.min(3, S.size + +g)); render(); break;
    case 'sizeReset': S.size = 1; render(); break;
    case 'contrast': S.contrast = !S.contrast; render(); break;
    case 'ignoreRepeat': S.ignoreRepeat = !S.ignoreRepeat; render(); break;
    case 'visual': S.visual = !S.visual; render(); break;
    case 'captions': S.captions = !S.captions; render(); break;
    case 'prefContact': S.contact = g; render(); break;
    case 'topic': { const t = S.offer.topics; S.offer.topics = t.includes(g) ? t.filter(x => x !== g) : t.concat(g); S.offer.err = false; render(); break; }
    case 'format': S.offer.format = g; render(); break;
    case 'day': { const d = S.offer.days; S.offer.days = d.includes(g) ? d.filter(x => x !== g) : d.concat(g); S.offer.err = false; render(); break; }
    case 'publish':
      if (!S.offer.topics.length){ S.offer.err = 'Escolha pelo menos uma matéria acima.'; render(); break; }
      if (!S.offer.days.length){ S.offer.err = 'Escolha pelo menos um dia acima.'; render(); break; }
      S.offer.done = true; lastScreen = null; render(); window.scrollTo(0,0); break;
    case 'offerEdit': S.offer.done = false; lastScreen = null; render(); break;
    case 'drawer': S.drawer = !S.drawer; render(); if (S.drawer){ const c = root.querySelector('.drawer .close'); c && c.focus(); } else { const f = root.querySelector('.fab'); f && f.focus(); } break;
    case 'pins': S.pins = !S.pins; render(); break;
    case 'simulate': {
      const pool = ['Seu Geraldo, amanhã a sala do reforço será a número 2, no térreo.','As crianças adoraram a última leitura. Até a próxima!','Lembrete: na quinta às 15h tem Roda de conversa no Centro Boa Esperança.'];
      receive(pool[S.convs.ana.msgs.length % pool.length]); break; }
  }
});
function jump(k){
  S.confirm = null;
  if (k === 'detalhe'){ S.opp = 'leitura'; S.hist = ['home','buscar']; }
  else if (k === 'inscricao'){ S.opp = 'leitura'; S.signup = {step:1, day:null, contact:S.contact, err:false}; S.hist = ['home','buscar','detalhe']; }
  else S.hist = k === 'home' ? [] : ['home'];
  if (k === 'mensagens'){ S.unread = 0; S.alert = null; }
  S.screen = k; render();
}
root.addEventListener('input', ev => { if (ev.target.id === 'draft') S.draft = ev.target.value; });
root.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute('aria-disabled') === 'true'){ ev.preventDefault(); toast('Este dia não está disponível'); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.drawer){ S.drawer = false; render(); } });

render();
})();
</script>

</body>
</html>
