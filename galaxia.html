<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galáxia Interativa — Sistema Solar 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000006;
    --panel: rgba(8, 12, 28, 0.62);
    --border: rgba(140, 170, 255, 0.18);
    --text: #e8ecff;
    --muted: #93a0c8;
    --accent: #7fb2ff;
    --sun: #ffb347;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  canvas#scene { position: fixed; inset: 0; display: block; cursor: grab; }
  canvas#scene.pointer { cursor: pointer; }
  canvas#scene:active { cursor: grabbing; }

  /* Loader */
  #loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(ellipse at center, #0b1030 0%, #000006 70%); transition: opacity 1.2s ease, visibility 1.2s; }
  #loader.hide { opacity: 0; visibility: hidden; }
  .orbit-loader { position: relative; width: 120px; height: 120px; }
  .orbit-loader .core { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; background: radial-gradient(circle, #fff6d0, #ffb347 60%, #ff6a00); box-shadow: 0 0 40px #ff9a2e, 0 0 90px #ff7b00; }
  .orbit-loader .ring { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.15); border-radius: 50%; animation: spin 2.4s linear infinite; }
  .orbit-loader .ring::after { content: ''; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #6fb6ff; box-shadow: 0 0 12px #6fb6ff; }
  .orbit-loader .ring.r2 { inset: 22px; animation-duration: 1.3s; }
  .orbit-loader .ring.r2::after { background: #ff7a50; box-shadow: 0 0 12px #ff7a50; width: 7px; height: 7px; top: -4px; margin-left: -3.5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader h2 { font-family: 'Sora', sans-serif; font-weight: 300; letter-spacing: .35em; font-size: 14px; text-transform: uppercase; color: var(--muted); }
  .bar { width: 220px; height: 2px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #6fb6ff, #ffb347); transition: width .25s; }

  /* Header */
  header { position: fixed; top: 22px; left: 26px; z-index: 10; pointer-events: none; }
  header h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(20px, 3vw, 34px); letter-spacing: .02em; background: linear-gradient(90deg, #ffffff, #9cc4ff 50%, #ffbf73); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin-top: 4px; font-size: 13px; color: var(--muted); letter-spacing: .08em; }

  /* Controls */
  #controls { position: fixed; top: 22px; right: 22px; z-index: 10; display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #controls input[type=range] { width: 110px; accent-color: var(--accent); }
  .tbtn { font: 500 12px 'DM Sans', sans-serif; color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; cursor: pointer; transition: background .2s, border-color .2s; }
  .tbtn:hover { background: rgba(127,178,255,.15); border-color: rgba(127,178,255,.5); }
  .tbtn.off { opacity: .45; }

  /* Planet dock */
  #dock { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
  #dock::-webkit-scrollbar { display: none; }
  .dock-item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; padding: 8px 6px 6px; border-radius: 12px; cursor: pointer; transition: background .25s, transform .25s; border: 1px solid transparent; background: none; color: var(--text); }
  .dock-item:hover, .dock-item.active { background: rgba(255,255,255,.07); transform: translateY(-4px); border-color: var(--border); }
  .dock-item .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset -5px -4px 8px rgba(0,0,0,.55); transition: transform .25s, box-shadow .25s; }
  .dock-item:hover .dot, .dock-item.active .dot { transform: scale(1.25); box-shadow: inset -5px -4px 8px rgba(0,0,0,.55), 0 0 16px var(--glow); }
  .dock-item span { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* Labels */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .label { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font: 600 11px 'Sora', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(220,230,255,.7); text-shadow: 0 0 8px rgba(0,0,0,.9); white-space: nowrap; transition: color .25s, font-size .25s, opacity .3s; will-change: transform; }
  .label::after { content: ''; display: block; width: 1px; height: 10px; margin: 3px auto 0; background: linear-gradient(rgba(220,230,255,.5), transparent); }
  .label.hot { color: #fff; font-size: 13px; text-shadow: 0 0 12px var(--glow), 0 0 4px #000; }
  #labels.hidden .label { opacity: 0; }

  /* Tooltip */
  #tooltip { position: fixed; z-index: 20; pointer-events: none; min-width: 210px; padding: 14px 16px; background: rgba(6, 10, 26, 0.82); border: 1px solid var(--border); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transform: translate(18px, 18px) scale(.94); transition: opacity .2s, transform .2s; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #tooltip.show { opacity: 1; transform: translate(18px, 18px) scale(1); }
  #tooltip h3 { font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  #tooltip h3 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #tooltip .type { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 2px 0 8px; }
  #tooltip .row { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.05); }
  #tooltip .row b { font-weight: 500; color: #fff; }
  #tooltip .row span { color: var(--muted); }
  #tooltip .hint { margin-top: 8px; font-size: 11px; color: var(--accent); }

  /* Info panel */
  #info { position: fixed; top: 50%; right: 22px; z-index: 15; width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 200px); overflow-y: auto; padding: 24px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transform: translate(120%, -50%); transition: transform .7s cubic-bezier(.2,.9,.2,1); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #info.open { transform: translate(0, -50%); }
  #info .kicker { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  #info h2 { font-family: 'Sora', sans-serif; font-size: 34px; font-weight: 800; margin: 4px 0 6px; }
  #info p.desc { font-size: 14px; line-height: 1.6; color: #c4cbe6; margin-bottom: 16px; }
  #info .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #info .stat { padding: 10px 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; }
  #info .stat span { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #info .stat b { display: block; margin-top: 3px; font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 600; }
  #info .fact { margin-top: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.55; border-left: 3px solid var(--glow, var(--accent)); background: rgba(255,255,255,.03); border-radius: 0 10px 10px 0; color: #d8def5; }
  #info .back { margin-top: 18px; width: 100%; padding: 11px; font: 600 13px 'Sora', sans-serif; color: #fff; background: linear-gradient(90deg, rgba(127,178,255,.25), rgba(255,179,71,.25)); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: filter .2s; }
  #info .back:hover { filter: brightness(1.4); }

  #hint { position: fixed; bottom: 112px; left: 50%; transform: translateX(-50%); z-index: 9; font-size: 12px; color: var(--muted); letter-spacing: .06em; text-align: center; pointer-events: none; transition: opacity 1s; white-space: nowrap; }

  @media (max-width: 720px) {
    header { top: 14px; left: 16px; }
    header p { display: none; }
    #controls { top: auto; bottom: 104px; right: 16px; left: 16px; justify-content: center; flex-wrap: wrap; }
    #hint { display: none; }
    #info { top: auto; bottom: 16px; right: 16px; transform: translateY(130%); max-height: 55vh; }
    #info.open { transform: translateY(0); }
    .dock-item { min-width: 54px; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="orbit-loader"><div class="ring"></div><div class="ring r2"></div><div class="core"></div></div>
  <h2 id="loadText">Gerando o universo</h2>
  <div class="bar"><span id="loadBar"></span></div>
</div>

<canvas id="scene"></canvas>
<div id="labels"></div>

<header>
  <h1>Via Láctea · Sistema Solar</h1>
  <p>Explore o Sol, os planetas, as luas e as estrelas</p>
</header>

<div id="controls">
  <label>Velocidade <input id="speed" type="range" min="0" max="4" step="0.05" value="1"></label>
  <button class="tbtn" id="btnOrbits">Órbitas</button>
  <button class="tbtn" id="btnLabels">Nomes</button>
</div>

<div id="tooltip"></div>

<aside id="info"></aside>

<div id="hint">Passe o mouse sobre os planetas · Clique para explorar · Arraste para girar · Role para aproximar</div>

<nav id="dock"></nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(async function () {
'use strict';

/* =========================================================
   Utilidades: aleatório com semente + ruído Perlin 3D
   ========================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makePerlin(seed) {
  const rand = mulberry32(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (t, a, b) => a + t * (b - a);
  const grad = (h, x, y, z) => {
    h &= 15;
    const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  };
  return function (x, y, z) {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    const X = fx & 255, Y = fy & 255, Z = fz & 255;
    x -= fx; y -= fy; z -= fz;
    const u = fade(x), v = fade(y), w = fade(z);
    const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
    const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
    return lerp(w,
      lerp(v, lerp(u, grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z)),
              lerp(u, grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z))),
      lerp(v, lerp(u, grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1)),
              lerp(u, grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1))));
  };
}

function fbm(n, x, y, z, oct, lac = 2.0, gain = 0.5) {
  let a = 1, f = 1, s = 0, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f, z * f); norm += a; a *= gain; f *= lac; }
  return s / norm;
}
function ridged(n, x, y, z, oct) {
  let a = 1, f = 1, s = 0, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * (1 - Math.abs(n(x * f, y * f, z * f))); norm += a; a *= 0.5; f *= 2.1; }
  return s / norm;
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

/* Pinta texturas equiretangulares: fn recebe um ponto da esfera e escreve em N camadas */
function paintSphere(w, h, layers, fn) {
  const canvases = [], ctxs = [], imgs = [];
  for (let l = 0; l < layers; l++) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    canvases.push(c); ctxs.push(ctx); imgs.push(ctx.createImageData(w, h));
  }
  const outs = [];
  for (let l = 0; l < layers; l++) outs.push([0, 0, 0]);
  for (let j = 0; j < h; j++) {
    const lat = (0.5 - (j + 0.5) / h) * Math.PI;
    const cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < w; i++) {
      const lon = (i + 0.5) / w * Math.PI * 2;
      const x = cl * Math.cos(lon), z = cl * Math.sin(lon), y = sl;
      fn(x, y, z, lat, lon, outs);
      const k = (j * w + i) * 4;
      for (let l = 0; l < layers; l++) {
        const d = imgs[l].data, o = outs[l];
        d[k] = clamp(o[0]) * 255; d[k + 1] = clamp(o[1]) * 255; d[k + 2] = clamp(o[2]) * 255; d[k + 3] = 255;
      }
    }
  }
  for (let l = 0; l < layers; l++) ctxs[l].putImageData(imgs[l], 0, 0);
  return canvases.map(c => { const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t; });
}

/* =========================================================
   Loader
   ========================================================= */
const loadBar = document.getElementById('loadBar');
const loadText = document.getElementById('loadText');
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
async function step(pct, text) { loadBar.style.width = pct + '%'; if (text) loadText.textContent = text; await nextFrame(); }

if (typeof THREE === 'undefined') {
  loadText.textContent = 'Não foi possível carregar o Three.js (verifique a internet)';
  return;
}

/* =========================================================
   Renderer, cena, câmera
   ========================================================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000004, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 12000);
camera.position.set(0, 520, 1300);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 1400;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.9;
controls.enabled = false;

const HOME_POS = new THREE.Vector3(0, 72, 180);
const HOME_TARGET = new THREE.Vector3(0, 0, 0);

let composer = null, bloomPass = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.5, 0.9);
  composer.addPass(bloomPass);
}

scene.add(new THREE.AmbientLight(0x1a2240, 0.55));
const sunLight = new THREE.PointLight(0xfff2dd, 1.15, 0, 0);
scene.add(sunLight);

/* Fundo (estrelas, galáxia, nebulosas) reage levemente ao mouse */
const backdrop = new THREE.Group();
scene.add(backdrop);

/* =========================================================
   Shaders reutilizáveis
   ========================================================= */
const starUniforms = {
  uTime: { value: 0 },
  uMouse: { value: new THREE.Vector2(10, 10) },
  uAspect: { value: window.innerWidth / window.innerHeight },
  uPixelRatio: { value: renderer.getPixelRatio() }
};
function starMaterial(sizeMul = 1) {
  return new THREE.ShaderMaterial({
    uniforms: Object.assign({ uSizeMul: { value: sizeMul } }, starUniforms),
    vertexShader: `
      attribute float size; attribute float phase; attribute vec3 color;
      uniform float uTime, uAspect, uPixelRatio, uSizeMul; uniform vec2 uMouse;
      varying vec3 vColor; varying float vGlow;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        vec2 ndc = gl_Position.xy / gl_Position.w;
        float d = length((ndc - uMouse) * vec2(uAspect, 1.0));
        float hover = smoothstep(0.32, 0.0, d) * step(0.0, gl_Position.w);
        float tw = 0.75 + 0.25 * sin(uTime * (1.2 + phase * 0.3) + phase * 6.2831);
        vGlow = hover;
        vColor = color * (tw + hover * 1.6);
        gl_PointSize = size * uSizeMul * uPixelRatio * (tw + hover * 2.2);
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vGlow;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float r = length(c);
        float core = smoothstep(0.5, 0.0, r);
        float a = pow(core, 2.2) + vGlow * 0.35 * core;
        // pequenos raios de difração ao passar o mouse
        float spikes = vGlow * (smoothstep(0.06, 0.0, abs(c.x)) + smoothstep(0.06, 0.0, abs(c.y))) * smoothstep(0.5, 0.1, r) * 0.6;
        gl_FragColor = vec4(vColor, a + spikes);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
}

const SIMPLEX = `
  vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
    i=mod(i,289.0);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }`;

const ringTex = (() => {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(S / 2, S / 2, S * 0.44, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 6;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(S / 2, S / 2, S * 0.47, i * Math.PI / 2 + 0.2, i * Math.PI / 2 + 0.75); ctx.stroke(); }
  return new THREE.CanvasTexture(c);
})();

function makeLabel(key) {
  const el = document.createElement('div');

function addHalo(obj, radius, color) {
  const mat = new THREE.SpriteMaterial({ map: ringTex, color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  const halo = new THREE.Sprite(mat); halo.scale.set(radius * 3.2, radius * 3.2, 1);
  const pulse = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTexture([[0, 'rgba(255,255,255,0)'], [0.6, 'rgba(255,255,255,0)'], [0.7, 'rgba(255,255,255,0.6)'], [0.8, 'rgba(255,255,255,0)']]), color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  obj.outer.add(halo); obj.outer.add(pulse);
  obj.halo = halo; obj.pulse = pulse; obj.pulseT = 1;
}

function makeOrbitLine(radius, color) {
  const pts = [];
  for (let i = 0; i <= 256; i++) { const a = i / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius)); }
  const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(line);
  return line;
}

function createPlanet(key, cfg) {
  const obj = { key, cfg, radius: cfg.radius, angle: cfg.start, hover: 0, hoverTarget: 0, spinMul: 1 };
  obj.outer = new THREE.Group();           // posição na órbita (escala no hover)
  obj.wobble = new THREE.Group();          // inclinação seguindo o mouse
  obj.tilt = new THREE.Group();            // inclinação axial real
  obj.tilt.rotation.z = THREE.MathUtils.degToRad(cfg.tilt || 0);
  obj.outer.add(obj.wobble); obj.wobble.add(obj.tilt);
  scene.add(obj.outer);

  const geo = new THREE.SphereGeometry(cfg.radius, 96, 64);
  obj.mesh = new THREE.Mesh(geo, cfg.material);
  obj.tilt.add(obj.mesh);

  if (cfg.atmosphere) {
    obj.atmo = new THREE.Mesh(new THREE.SphereGeometry(cfg.radius * 1.06, 64, 48), atmosphereMaterial(...cfg.atmosphere));
    obj.tilt.add(obj.atmo);
  }
  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(cfg.radius * 1.5, cfg.radius + 1.6), 16, 12),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false }));
  hit.userData.body = obj; obj.outer.add(hit); hitMeshes.push(hit);

  if (cfg.distance) obj.orbit = makeOrbitLine(cfg.distance, DATA[key].color);
  obj.label = makeLabel(key);
  addHalo(obj, cfg.radius, DATA[key].color);
  bodies.push(obj);
  return obj;
}

function makeRing(planet, inner, outer, tex, opacity) {
  const g = new THREE.RingGeometry(inner, outer, 180, 1);
  const pos = g.attributes.position, uv = g.attributes.uv, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5); }
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex, color: 0xd8d2c8, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity }));
  m.rotation.x = -Math.PI / 2;
  planet.tilt.add(m);
  return m;
}

const belt = new THREE.Group(); scene.add(belt);
{
  const N = 2600, rnd = mulberry32(17);
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const pa = geo.attributes.position;
  for (let i = 0; i < pa.count; i++) pa.setXYZ(i, pa.getX(i) * (0.7 + rnd() * 0.6), pa.getY(i) * (0.7 + rnd() * 0.6), pa.getZ(i) * (0.7 + rnd() * 0.6));
  geo.computeVertexNormals();
  const inst = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 1, flatShading: true }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler();
  const col = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const a = rnd() * Math.PI * 2, r = 58 + (rnd() + rnd() + rnd()) / 3 * 14;
    p.set(Math.cos(a) * r, (rnd() - 0.5) * 2.4, Math.sin(a) * r);
    e.set(rnd() * 6, rnd() * 6, rnd() * 6); q.setFromEuler(e);
    const sc = 0.05 + Math.pow(rnd(), 4) * 0.35; s.set(sc, sc * (0.6 + rnd() * 0.6), sc);
    m.compose(p, q, s); inst.setMatrixAt(i, m);
    col.setHSL(0.07 + rnd() * 0.05, 0.15 + rnd() * 0.15, 0.3 + rnd() * 0.25); inst.setColorAt(i, col);
  }
  belt.add(inst);
  // poeira do cinturão
  const D = 6000, dp = new Float32Array(D * 3), dc = new Float32Array(D * 3), ds = new Float32Array(D), dph = new Float32Array(D);
  for (let i = 0; i < D; i++) {
    const a = rnd() * Math.PI * 2, r = 56 + (rnd() + rnd()) / 2 * 18;
    dp[i * 3] = Math.cos(a) * r; dp[i * 3 + 1] = (rnd() - 0.5) * 3; dp[i * 3 + 2] = Math.sin(a) * r;
    dc[i * 3] = 0.5; dc[i * 3 + 1] = 0.42; dc[i * 3 + 2] = 0.34; ds[i] = 1 + rnd() * 1.5; dph[i] = rnd();
  }
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.BufferAttribute(dp, 3)); dg.setAttribute('color', new THREE.BufferAttribute(dc, 3));
  dg.setAttribute('size', new THREE.BufferAttribute(ds, 1)); dg.setAttribute('phase', new THREE.BufferAttribute(dph, 1));
  belt.add(new THREE.Points(dg, starMaterial(0.8)));
}

/* =========================================================
   Câmera: voos e acompanhamento
   ========================================================= */
let fly = null, focused = null;
const followLast = new THREE.Vector3();
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function worldPos(b, out) { return (b.isSun ? out.set(0, 0, 0) : b.outer.getWorldPosition(out)); }

function flyTo(posFn, targetFn, dur, onDone) {
  fly = { t: 0, dur, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), posFn, targetFn, onDone };
  controls.enabled = false;
}

function focusOn(b) {
  focused = null;
  const wp = worldPos(b, new THREE.Vector3());
  const dist = b.isSun ? SUN_R * 4.2 : b.radius * (b.key === 'saturno' ? 6.5 : 5.5) + 2;
  let dir = camera.position.clone().sub(wp).normalize();
  if (!b.isSun) {
    // vista com o lado iluminado de frente, levemente de cima
    const sunDir = wp.clone().negate().normalize();
    dir = sunDir.multiplyScalar(0.75).add(dir.multiplyScalar(0.25)).normalize();
    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.6);
  }
  dir.y += 0.28; dir.normalize();
  const off = dir.multiplyScalar(dist);
  flyTo(() => worldPos(b, tmpV2).add(off), () => worldPos(b, tmpV2), 2.0, () => {
    focused = b; worldPos(b, followLast);
  });
  controls.minDistance = b.radius * 1.6;
  openInfo(b);
  hint.style.opacity = 0;
}

function goHome() {
  focused = null;
  info.classList.remove('open');
  Object.values(dockButtons).forEach(x => x.classList.remove('active'));
  controls.minDistance = 4;
  flyTo(() => HOME_POS, () => HOME_TARGET, 2.0);
}

/* =========================================================
   Mouse / interação
   ========================================================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(10, 10);
const mouseSmooth = new THREE.Vector2(0, 0);
let hovered = null, dockHover = null, pointerDown = null, mouseInside = false;

canvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX / window.innerWidth * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  mouseInside = true;
  tooltip.style.left = e.clientX + 'px';
  tooltip.style.top = e.clientY + 'px';
});
canvas.addEventListener('pointerleave', () => { mouseInside = false; mouse.set(10, 10); });
canvas.addEventListener('pointerdown', e => { pointerDown = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!pointerDown) return;
  const moved = Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y);
  pointerDown = null;
  if (moved > 6) return;
  mouse.x = e.clientX / window.innerWidth * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  const b = pick();
  if (b) focusOn(b);
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });

function pick() {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  if (!hits.length) return null;
  // prioriza o corpo menor quando os volumes se sobrepõem (ex.: Lua na frente da Terra)
  hits.sort((a, b) => (a.distance - b.distance) || (a.object.userData.body.radius - b.object.userData.body.radius));
  return hits[0].object.userData.body;
}

function setHovered(b) {
  if (b === hovered) return;
  if (hovered) { hovered.hoverTarget = 0; hovered.label.classList.remove('hot'); }
  hovered = b;
  if (b) {
    b.hoverTarget = 1; b.pulseT = 0;
    b.label.classList.add('hot');
    tooltip.innerHTML = tooltipHTML(b);
    tooltip.classList.add('show');
    canvas.classList.add('pointer');
  } else {
    tooltip.classList.remove('show');
    canvas.classList.remove('pointer');
  }
}

// Botões
let speed = 1, showOrbits = true, showLabels = true;
document.getElementById('speed').addEventListener('input', e => { speed = parseFloat(e.target.value); });
document.getElementById('btnOrbits').addEventListener('click', e => { showOrbits = !showOrbits; e.target.classList.toggle('off', !showOrbits); });
document.getElementById('btnLabels').addEventListener('click', e => { showLabels = !showLabels; e.target.classList.toggle('off', !showLabels); labelsEl.classList.toggle('hidden', !showLabels); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  starUniforms.uAspect.value = camera.aspect;
});

/* =========================================================
   Loop de animação
   ========================================================= */
const clock = new THREE.Clock();
let simTime = 0, nextShoot = 2;
const proj = new THREE.Vector3();

function updateLabel(b) {
  worldPos(b, proj);
  const s = b.outer.scale.x;
  proj.y += b.radius * s * 1.25 + 0.3;
  proj.project(camera);
  const visible = proj.z < 1 && Math.abs(proj.x) < 1.2 && Math.abs(proj.y) < 1.2;
  // esconde nomes de luas e corpos pequenos quando estão muito longe
  const dist = camera.position.distanceTo(worldPos(b, tmpV));
  const tooFar = (b.isMoon && dist > 70) || (focused && focused !== b && dist > 400);
  b.label.style.opacity = visible && !tooFar ? (b.hover > 0.5 ? 1 : 0.85) : 0;
  b.label.style.transform = `translate(${(proj.x * 0.5 + 0.5) * window.innerWidth}px, ${(-proj.y * 0.5 + 0.5) * window.innerHeight}px) translate(-50%, -100%)`;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  simTime += dt * speed;
  starUniforms.uTime.value = t;
  sunUniforms.uTime.value = t;

  mouseSmooth.lerp(mouseInside ? mouse : new THREE.Vector2(0, 0), 0.05);
  starUniforms.uMouse.value.copy(mouseInside ? mouse : new THREE.Vector2(10, 10));

  // hover
  if (!fly) setHovered(mouseInside ? pick() : null);
  if (hovered) tooltip.innerHTML = tooltipHTML(hovered);

  // Sol
  sunObj.hover += ((hovered === sunObj || dockHover === sunObj ? 1 : 0) - sunObj.hover) * 0.08;
  sunMesh.rotation.y += dt * (0.03 + sunObj.hover * 0.25);
  sunUniforms.uBoost.value = sunObj.hover;
  const sunPulse = 1 + Math.sin(t * 1.3) * 0.02;
  sunGlow1.scale.setScalar(62 * sunPulse * (1 + sunObj.hover * 0.35));
  sunGlow2.scale.setScalar(170 * (1 + sunObj.hover * 0.25));
  corona.scale.setScalar(80 * (1 + sunObj.hover * 0.5));
  coronaMat.rotation += dt * (0.02 + sunObj.hover * 0.3);
  coronaMat.opacity = 0.6 + sunObj.hover * 0.4;
  sunLight.intensity = 1.15 + sunObj.hover * 0.45;
  if (bloomPass) bloomPass.strength = 1.05 + sunObj.hover * 0.6;

  // Planetas
  for (const b of bodies) {
    const target = (hovered === b || dockHover === b) ? 1 : 0;
    b.hover += (target - b.hover) * 0.09;
    const h = b.hover;
    if (!b.isSun) {
      const s = 1 + h * (b.isMoon ? 0.6 : 0.35);
      b.outer.scale.setScalar(s);
    }
    if (b.cfg.distance) {
      b.angle += dt * speed * 0.35 * Math.pow(b.cfg.period, -0.62) * (1 - h * 0.92);
      b.outer.position.set(Math.cos(b.angle) * b.cfg.distance, 0, -Math.sin(b.angle) * b.cfg.distance);
      b.mesh.rotation.y += dt * (0.3 + speed * 0.3) * b.cfg.spin * (1 + h * 5);
      b.orbit.visible = showOrbits;
      b.orbit.material.opacity = 0.14 + h * 0.6;
      if (b.atmo) b.atmo.material.uniforms.uBoost.value = h * 1.2;
    }
    if (b.wobble) {
      // o planeta "olha" para o mouse
      worldPos(b, proj).project(camera);
      const dx = clamp(mouse.x - proj.x, -0.4, 0.4), dy = clamp(mouse.y - proj.y, -0.4, 0.4);
      b.wobble.rotation.x += ((-dy * 1.4 * h) - b.wobble.rotation.x) * 0.1;
      b.wobble.rotation.z += ((-dx * 1.4 * h) - b.wobble.rotation.z) * 0.1;
    }
    // halo e pulso
    b.halo.material.opacity = h * 0.85;
    b.halo.material.rotation += dt * (0.4 + h);
    const hs = b.radius * (b.isSun ? 2.8 : 3.2) * (1 + Math.sin(t * 3) * 0.03 * h);
    b.halo.scale.set(hs, hs, 1);
    if (b.pulseT < 1) {
      b.pulseT = Math.min(1, b.pulseT + dt * 1.1);
      const ps = b.radius * (2 + b.pulseT * (b.isSun ? 3 : 6));
      b.pulse.scale.set(ps, ps, 1);
      b.pulse.material.opacity = (1 - b.pulseT) * 0.8;
    } else b.pulse.material.opacity = 0;
    updateLabel(b);
  }

  // Terra
  clouds.rotation.y += dt * 0.025 * (1 + earth.hover * 4);
  nightLightsMat.uniforms.uBoost.value = earth.hover;
  moon.angle += dt * speed * 0.9 * (1 - moon.hover * 0.9);
  moonPivot.rotation.y = moon.angle;
  moon.mesh.rotation.y = -moon.angle; // rotação sincronizada (mesma face para a Terra)
  saturnRings.rotation.z += dt * 0.01;
  for (const m of smallMoons) { m.a += dt * speed * m.speed; m.pivot.rotation.y = m.a; }
  belt.rotation.y += dt * speed * 0.02;

  // Fundo
  galaxy.rotation.y += dt * 0.01;
  backdrop.rotation.y += ((mouseSmooth.x * 0.05) - backdrop.rotation.y) * 0.05;
  backdrop.rotation.x += ((-mouseSmooth.y * 0.03) - backdrop.rotation.x) * 0.05;

  // Estrelas cadentes
  nextShoot -= dt;
  if (nextShoot < 0) { spawnShootingStar(); nextShoot = 2 + Math.random() * 4; }
  for (let i = shooting.length - 1; i >= 0; i--) {
    const s = shooting[i]; s.t += dt;
    const head = s.start.clone().addScaledVector(s.dir, s.t * s.speed);
    const tail = head.clone().addScaledVector(s.dir, -Math.min(s.t, 0.25) * s.speed);
    const pa = s.line.geometry.attributes.position;
    pa.setXYZ(0, head.x, head.y, head.z); pa.setXYZ(1, tail.x, tail.y, tail.z); pa.needsUpdate = true;
    s.line.material.opacity = Math.sin(Math.PI * s.t / s.life);
    if (s.t > s.life) { scene.remove(s.line); s.line.geometry.dispose(); s.line.material.dispose(); shooting.splice(i, 1); }
  }

  // Câmera
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / fly.dur);
    const e = ease(fly.t);
    camera.position.lerpVectors(fly.fromPos, fly.posFn(), e);
    controls.target.lerpVectors(fly.fromTarget, fly.targetFn(), e);
    camera.lookAt(controls.target);
    if (fly.t >= 1) { const done = fly.onDone; fly = null; controls.enabled = true; if (done) done(); }
  } else {
    if (focused) {
      worldPos(focused, tmpV);
      const delta = tmpV.clone().sub(followLast);
      camera.position.add(delta); controls.target.add(delta);
      followLast.copy(tmpV);
    }
    controls.update();
  }

  if (composer) composer.render(); else renderer.render(scene, camera);
}

/* =========================================================
   Início
   ========================================================= */
await step(100, 'Pronto');
animate();
setTimeout(() => document.getElementById('loader').classList.add('hide'), 300);
flyTo(() => HOME_POS, () => HOME_TARGET, 4.0);
setTimeout(() => { hint.style.opacity = 0; }, 12000);

})();
</script>
</body>
